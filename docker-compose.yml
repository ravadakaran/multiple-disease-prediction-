services:
  mediscan-ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mediscan_ai_platform
    ports:
      - "8000:8000"
    restart: unless-stopped
    environment:
      - PORT=8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

